[workspace]
resolver = "2"
members = ["crates/fold-core", "crates/fold-tui", "crates/fold-cli"]

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
notify = "8"
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
indexmap = "2"
nucleo = "0.5"
similar = "2"
blake3 = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"
directories = "6"
getrandom = "0.3"
anyhow = "1"
thiserror = "2"

[profile.dev]
opt-level = 1
